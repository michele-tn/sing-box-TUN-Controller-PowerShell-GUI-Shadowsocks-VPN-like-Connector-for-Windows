<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SingBoxTunGui project presentation</title>
  <desc id="desc">A presentation graphic for SingBoxTunGui showing a signed encrypted executable build pipeline.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#176284"/>
      <stop offset="1" stop-color="#27b075"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fbfc"/>
      <stop offset="1" stop-color="#edf4f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1f2a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#eef4f6"/>
  <rect x="48" y="48" width="1104" height="579" rx="18" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="48" y="48" width="1104" height="156" rx="18" fill="url(#header)"/>
  <path d="M48 186 H1152 V204 H48 Z" fill="#176284"/>

  <g transform="translate(86 76)">
    <circle cx="50" cy="50" r="48" fill="#ffffff" opacity="0.18"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#ffffff" stroke-width="7"/>
    <path d="M33 51 C38 31 62 31 67 51" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="50" cy="53" r="6" fill="#ffffff"/>
  </g>

  <text x="176" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">SingBoxTunGui</text>
  <text x="178" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#e7fff6">Encrypted, signed Windows distribution for a sing-box TUN GUI</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(96 252)">
      <rect width="292" height="260" rx="12" fill="#ffffff" stroke="#d6e3e6"/>
      <text x="24" y="42" font-size="22" font-weight="700" fill="#12313d">Source</text>
      <text x="24" y="82" font-size="18" fill="#3a5863">PowerShell WinForms GUI</text>
      <text x="24" y="114" font-size="16" fill="#5f767d">extracted_source/SingBoxTunGui.ps1</text>
      <rect x="24" y="150" width="244" height="74" rx="8" fill="#edf7f8"/>
      <text x="48" y="196" font-size="34" font-weight="700" fill="#176284">.ps1</text>
      <path d="M190 172 h42 v34 h-42 z" fill="none" stroke="#27b075" stroke-width="4"/>
      <path d="M201 172 v-10 c0-13 20-13 20 0 v10" fill="none" stroke="#27b075" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(454 252)">
      <rect width="292" height="260" rx="12" fill="#ffffff" stroke="#d6e3e6"/>
      <text x="24" y="42" font-size="22" font-weight="700" fill="#12313d">Build</text>
      <text x="24" y="82" font-size="18" fill="#3a5863">AES-256 payload encryption</text>
      <text x="24" y="114" font-size="16" fill="#5f767d">C# launcher + generated icon</text>
      <rect x="24" y="150" width="244" height="74" rx="8" fill="#f1f6ef"/>
      <text x="48" y="196" font-size="34" font-weight="700" fill="#1a6b4a">EXE</text>
      <path d="M190 185 l16 16 l34-42" fill="none" stroke="#27b075" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(812 252)">
      <rect width="292" height="260" rx="12" fill="#ffffff" stroke="#d6e3e6"/>
      <text x="24" y="42" font-size="22" font-weight="700" fill="#12313d">Release</text>
      <text x="24" y="82" font-size="18" fill="#3a5863">Signed executable package</text>
      <text x="24" y="114" font-size="16" fill="#5f767d">Certificate + SHA-256 checksum</text>
      <rect x="24" y="150" width="244" height="74" rx="8" fill="#f6f4ec"/>
      <text x="48" y="196" font-size="30" font-weight="700" fill="#795a13">dist/</text>
      <text x="154" y="191" font-size="18" fill="#3a5863">.exe</text>
      <text x="154" y="214" font-size="18" fill="#3a5863">.sha256</text>
    </g>

    <path d="M404 382 H438" stroke="#176284" stroke-width="5" stroke-linecap="round"/>
    <path d="M438 382 l-12 -10 v20 z" fill="#176284"/>
    <path d="M762 382 H796" stroke="#176284" stroke-width="5" stroke-linecap="round"/>
    <path d="M796 382 l-12 -10 v20 z" fill="#176284"/>

    <g transform="translate(96 552)">
      <rect width="1008" height="44" rx="8" fill="#12313d"/>
      <text x="24" y="29" font-size="18" fill="#ffffff">Build command:</text>
      <text x="158" y="29" font-size="18" fill="#b7f3d6">powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build_encrypted_exe.ps1</text>
    </g>
  </g>
</svg>
